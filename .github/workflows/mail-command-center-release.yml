# Builds and publishes a Mail Command Center release for Windows and macOS.
#
# Two ways to release:
#   - Actions tab → "Mail Command Center release" → Run workflow → enter a
#     version like 1.2.1 (run it from the main branch). The workflow creates
#     the mcc-v1.2.1 tag itself. Tick "Dry run" to build without publishing;
#     the installers are then attached to the run as downloadable artifacts.
#   - Or push a tag:  git tag mcc-v1.2.1 && git push origin mcc-v1.2.1
#
# Windows and macOS build in parallel; the release is published only if both
# succeed, so a failed Mac build never leaves Windows users with a half release.
#
# Publishes the installers as a GitHub Release in this repo. Installed apps check
# this repo's latest release (Windows updates itself; macOS shows a download
# link). That works without any token in the app because this repo is public.
#
# No setup needed: it uses the built-in GITHUB_TOKEN.

name: Mail Command Center release

on:
  push:
    tags: ['mcc-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 1.2.1 (must be higher than the last release)'
        required: true
      dry_run:
        description: 'Dry run: build the installers but do not publish a release'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: mcc-release
  cancel-in-progress: false

env:
  PUBLISH_FLAGS: >-
    -c.publish.provider=github
    -c.publish.owner=${{ github.repository_owner }}
    -c.publish.repo=${{ github.event.repository.name }}
    -c.publish.releaseType=release

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check repo is public
        run: |
          vis=$(gh repo view "$GITHUB_REPOSITORY" --json visibility -q .visibility)
          [ "$vis" = "PUBLIC" ] || { echo "::error::$GITHUB_REPOSITORY is $vis. Installed apps can only download updates from a public repo."; exit 1; }

      - name: Work out version and tag
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$GITHUB_REF" = "refs/heads/main" ] || { echo "::error::Run this workflow from the main branch"; exit 1; }
            VERSION="${INPUT_VERSION#v}"
          else
            VERSION="${GITHUB_REF_NAME#mcc-v}"
          fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Version must look like 1.2.3"; exit 1; }
          TAG="mcc-v$VERSION"
          PUBLISH=true
          [ "$DRY_RUN" = "true" ] && PUBLISH=false
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && [ "$PUBLISH" = "true" ] \
             && gh api "repos/$GITHUB_REPOSITORY/git/refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists. Pick a higher version."; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, tag $TAG, publish: $PUBLISH" >> "$GITHUB_STEP_SUMMARY"

  build-windows:
    needs: prepare
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: mail-command-center
    env:
      V: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mail-command-center/package-lock.json
      - run: npm version "$V" --no-git-tag-version --allow-same-version
      - run: npm ci
      - name: Build installer
        run: npx electron-builder --win --x64 --publish never $PUBLISH_FLAGS
      - name: Verify build
        run: |
          ls dist
          test -f "dist/Mail-Command-Center-Setup-$V.exe"
          test -f "dist/Mail-Command-Center-Setup-$V.exe.blockmap"
          grep -q "version: $V" dist/latest.yml
          grep -qi "repo: ${{ github.event.repository.name }}" dist/win-unpacked/resources/app-update.yml
          npx @electron/fuses read --app "dist/win-unpacked/Mail Command Center.exe" | tee fuses.txt
          grep -q "EnableCookieEncryption is Enabled" fuses.txt
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          if-no-files-found: error
          path: |
            mail-command-center/dist/Mail-Command-Center-Setup-${{ needs.prepare.outputs.version }}.exe
            mail-command-center/dist/Mail-Command-Center-Setup-${{ needs.prepare.outputs.version }}.exe.blockmap
            mail-command-center/dist/latest.yml

  build-mac:
    needs: prepare
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
        working-directory: mail-command-center
    env:
      V: ${{ needs.prepare.outputs.version }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned build: never pick up a certificate
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mail-command-center/package-lock.json
      - run: npm version "$V" --no-git-tag-version --allow-same-version
      - run: npm ci
      - name: Build disk images (Apple Silicon and Intel)
        run: npx electron-builder --mac --publish never $PUBLISH_FLAGS
      - name: Verify build
        run: |
          ls dist
          for arch in arm64 x64; do
            test -f "dist/Mail-Command-Center-$V-mac-$arch.dmg"
          done
          for app in "dist/mac-arm64/Mail Command Center.app" "dist/mac/Mail Command Center.app"; do
            codesign --verify --deep --strict "$app"
            grep -qi "repo: ${{ github.event.repository.name }}" "$app/Contents/Resources/app-update.yml"
            npx @electron/fuses read --app "$app" | tee fuses.txt
            grep -q "EnableCookieEncryption is Enabled" fuses.txt
          done
          lipo -archs "dist/mac-arm64/Mail Command Center.app/Contents/MacOS/Mail Command Center" | grep -qx arm64
          lipo -archs "dist/mac/Mail Command Center.app/Contents/MacOS/Mail Command Center" | grep -qx x86_64
      - name: Start the app once (smoke test)
        run: |
          APP="dist/mac-arm64/Mail Command Center.app/Contents/MacOS/Mail Command Center"
          "$APP" > smoke.log 2>&1 & PID=$!
          sleep 20
          if kill -0 $PID 2>/dev/null; then echo "app is running"; kill $PID; else cat smoke.log; echo "::error::The Mac app exited on startup"; exit 1; fi
      - uses: actions/upload-artifact@v5
        with:
          name: mac
          if-no-files-found: error
          path: |
            mail-command-center/dist/Mail-Command-Center-${{ needs.prepare.outputs.version }}-mac-arm64.dmg
            mail-command-center/dist/Mail-Command-Center-${{ needs.prepare.outputs.version }}-mac-x64.dmg

  publish:
    # Runs on dry runs too, to check the collected files; only the final step
    # that creates the release is skipped.
    needs: [prepare, build-windows, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and upload the installers
    env:
      GH_TOKEN: ${{ github.token }}
      V: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true
      - name: Check all installers are here
        run: |
          ls -l dist
          for f in "Mail-Command-Center-Setup-$V.exe" "Mail-Command-Center-Setup-$V.exe.blockmap" latest.yml \
                   "Mail-Command-Center-$V-mac-arm64.dmg" "Mail-Command-Center-$V-mac-x64.dmg"; do
            test -f "dist/$f" || { echo "::error::missing $f"; exit 1; }
          done
      - name: Publish release
        if: needs.prepare.outputs.publish == 'true'
        # Created as a draft, then published once every file is uploaded, so
        # apps never see a release with an installer missing.
        run: |
          ls -l dist
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "Mail Command Center $V" --generate-notes \
            "dist/Mail-Command-Center-Setup-$V.exe" \
            "dist/Mail-Command-Center-Setup-$V.exe.blockmap" \
            "dist/latest.yml" \
            "dist/Mail-Command-Center-$V-mac-arm64.dmg" \
            "dist/Mail-Command-Center-$V-mac-x64.dmg"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
