# Builds and publishes a Mail Command Center release.
#
# Trigger: push a tag like  mcc-v1.2.0
#   git tag mcc-v1.2.0 && git push origin mcc-v1.2.0
#
# The installed apps check MCC_UPDATE_URL for latest.yml and update themselves.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   secrets.CLOUDFLARE_API_TOKEN   token with "Workers R2 Storage: Edit"
#   secrets.CLOUDFLARE_ACCOUNT_ID  your Cloudflare account ID
#   vars.MCC_R2_BUCKET             R2 bucket name, e.g. mail-command-center-updates
#   vars.MCC_UPDATE_URL            public URL of that bucket + /mail-command-center
#                                  e.g. https://pub-xxxxxxxx.r2.dev/mail-command-center

name: Mail Command Center release

on:
  push:
    tags: ['mcc-v*']

permissions:
  contents: write # to create the GitHub Release

concurrency:
  group: mcc-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: mail-command-center
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      MCC_R2_BUCKET: ${{ vars.MCC_R2_BUCKET }}
      MCC_UPDATE_URL: ${{ vars.MCC_UPDATE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ]  || missing="$missing secrets.CLOUDFLARE_API_TOKEN"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing secrets.CLOUDFLARE_ACCOUNT_ID"
          [ -n "$MCC_R2_BUCKET" ]         || missing="$missing vars.MCC_R2_BUCKET"
          [ -n "$MCC_UPDATE_URL" ]        || missing="$missing vars.MCC_UPDATE_URL"
          if [ -n "$missing" ]; then echo "::error::Missing repo settings:$missing"; exit 1; fi
          case "$MCC_UPDATE_URL" in https://*) ;; *) echo "::error::MCC_UPDATE_URL must start with https://"; exit 1;; esac

      - name: Set version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#mcc-v}"
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Tag must look like mcc-v1.2.3"; exit 1; }
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mail-command-center/package-lock.json

      - run: npm ci

      - name: Build installer
        run: >
          npx electron-builder --win --x64 --publish never
          -c.publish.provider=generic
          -c.publish.url="$MCC_UPDATE_URL"

      - name: Verify build
        run: |
          V="${{ steps.version.outputs.version }}"
          ls dist
          test -f "dist/Mail-Command-Center-Setup-$V.exe"
          test -f "dist/Mail-Command-Center-Setup-$V.exe.blockmap"
          grep -q "version: $V" dist/latest.yml
          grep -q "$MCC_UPDATE_URL" "dist/win-unpacked/resources/app-update.yml"

      - name: Upload to R2
        # Installer first, latest.yml last, so apps never see a manifest
        # pointing at a file that isn't there yet.
        run: |
          V="${{ steps.version.outputs.version }}"
          put() { npx -y wrangler@3.99.0 r2 object put "$MCC_R2_BUCKET/mail-command-center/$1" --file "dist/$1" "${@:2}"; }
          put "Mail-Command-Center-Setup-$V.exe"          --content-type application/vnd.microsoft.portable-executable
          put "Mail-Command-Center-Setup-$V.exe.blockmap" --content-type application/octet-stream
          put "latest.yml" --content-type text/yaml --cache-control "no-cache, max-age=0"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" "dist/Mail-Command-Center-Setup-$V.exe" \
            --title "Mail Command Center $V" --generate-notes
